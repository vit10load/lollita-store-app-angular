<!--
	cep	cpf	data_nascimento	email	endereco	nome	numero	telefone
-->
<form class="container-form">

    <h2>Cadastrar um novo cliente</h2>

    <mat-form-field appearance="legacy" color="accent">
        <mat-label>Nome</mat-label>
        <input matInput placeholder="Informe seu nome" [(ngModel)]="novoCliente.nome" [ngModelOptions]="{standalone: true}">
    </mat-form-field>

    <mat-form-field appearance="legacy" color="accent">
        <mat-label>Email</mat-label>
        <input matInput placeholder="email" [(ngModel)]="novoCliente.email" [ngModelOptions]="{standalone: true}">
    </mat-form-field>

    <mat-form-field appearance="legacy" color="accent">
        <mat-label>CPF</mat-label>
        <input matInput placeholder="CPF" [(ngModel)]="novoCliente.cpfOuCnpj" [ngModelOptions]="{standalone: true}">
    </mat-form-field>

    <mat-form-field appearance="legacy" color="accent">
        <mat-label>Logradouro</mat-label>
        <input matInput placeholder="Logradouro" [(ngModel)]="novoCliente.logradouro" [ngModelOptions]="{standalone: true}">
    </mat-form-field>

    <mat-form-field appearance="legacy" color="accent">
        <mat-label>Numero</mat-label>
        <input matInput placeholder="Numero?" [(ngModel)]="novoCliente.numero" [ngModelOptions]="{standalone: true}">
    </mat-form-field>

    <mat-form-field appearance="fill" color="accent">
        <mat-label>Tipo de cliente</mat-label>
        <mat-select [(ngModel)]="novoCliente.tipo" [ngModelOptions]="{standalone: true}">
            <mat-option *ngFor="let per of persons" [value]="per.value">
                {{per.viewValue}}
            </mat-option>
        </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill" color="accent">
        <mat-label>Cep</mat-label>
        <input matInput placeholder="79400-000" [(ngModel)]="novoCliente.cep" [ngModelOptions]="{standalone: true}">
    </mat-form-field>

    <mat-form-field appearance="legacy" color="accent">
        <mat-label>Senha</mat-label>
        <input [(ngModel)]="novoCliente.senha" placeholder="Digite uma senha" matInput [type]="hide ? 'password' : 'text'" [ngModelOptions]="{standalone: true}">
        <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
			<mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
		</button>
    </mat-form-field>

    <mat-form-field appearance="legacy" color="accent">
        <mat-label>Confirmar Senha</mat-label>
        <input [(ngModel)]="confirmarSenha" placeholder="Confirmar Senha" matInput [type]="hide ? 'password' : 'text'" [ngModelOptions]="{standalone: true}">
        <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
			<mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
		</button>
    </mat-form-field>

    <mat-form-field appearance="legacy" color="accent">
        <mat-label>Telefone para contato</mat-label>
        <input matInput placeholder="Telefone" [(ngModel)]="novoCliente.telefone1" [ngModelOptions]="{standalone: true}">
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="addCliente()">SALVAR</button>
</form>
